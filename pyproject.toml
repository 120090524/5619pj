[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-jury"
version = "0.1.0"
description = "Course project scaffold for attack-aware selective jury aggregation in LLM safety evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "tqdm>=4.66",
  "litellm>=1.63",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
