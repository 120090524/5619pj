project_name: student_guard_eval
seed: 42
output_dir: runs/student_guard_eval

dataset:
  calibration_path: data/student_guard/eval_examples_train.jsonl
  test_path: data/student_guard/eval_examples_test.jsonl

judges:
  - name: student_guard
    backend: hf_classifier
    model: checkpoints/student_guard
    threshold: 0.5
    max_length: 1024
    trust_remote_code: true

prompts:
  - safety_direct

order_variants:
  - original

attacks_target_field: response_a

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

methods:
  - single_best
  - majority_vote
  - clean_weighted
  - sentry

aggregation:
  lambda_attack: 1.0
  rho_dependence: 0.5
  margin: 0.2
