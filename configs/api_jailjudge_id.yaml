project_name: jailjudge_id_main
seed: 42

dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl
  calibration_limit: 150
  test_limit: 150

judges:
  - name: gpt4o_mini_judge
    backend: litellm
    model: openai/gpt-4o-mini
    temperature: 0.0

prompts:
  - safety_direct
  - safety_rubric

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

methods:
  - single_best
  - majority_vote
  - clean_weighted
  - sentry

enable_prediction_cache: true
order_variants:
  - original
attacks_target_field: response_a

aggregation:
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/jailjudge_id_main