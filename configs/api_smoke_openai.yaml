project_name: api_smoke_openai
seed: 42

dataset:
  path: data/final/beavertails_warmup.jsonl
  calibration_fraction: 0.5
  calibration_limit: 50
  test_limit: 50

judges:
  - name: gpt4o_mini_judge
    backend: litellm
    model: openai/gpt-4o-mini
    temperature: 0.0

prompts:
  - safety_direct

attacks:
  - universal_phrase

probes:
  - whitespace_normalize
  - strip_judge_directives

methods:
  - single_best

enable_prediction_cache: true
order_variants:
  - original
attacks_target_field: response_a

aggregation:
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/api_smoke_openai