project_name: otto_prompt_ablation_v1_smoke
seed: 42
dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl
  calibration_limit: 50
  test_limit: 50

judges:
  - name: gpt4o_mini_judge
    backend: litellm
    model: openai/gpt-4o-mini
    temperature: 0.0

prompts:
  - safety_direct
  - safety_rubric
  - safety_cot
  - safety_strict
  - safety_lenient

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

aggregation:
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

enable_prediction_cache: true

output_dir: runs/otto_prompt_ablation_v1_smoke