project: llama3lite_single_experiment
seed: 42

dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl

# 1 model x 3 instances x 2 prompts = 6 sensors
judges:
  - name: llama3lite_a
    backend: litellm
    model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite
    temperature: 0.0

  - name: llama3lite_b
    backend: litellm
    model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite
    temperature: 0.0

  - name: llama3lite_c
    backend: litellm
    model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite
    temperature: 0.0

prompts:
  - safety_direct
  - safety_rubric

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

aggregation:
  methods:
    - single_best
    - majority_vote
    - clean_weighted
    - sentry
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/llama3lite_single_experiment
