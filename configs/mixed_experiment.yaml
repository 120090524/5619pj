project: mixed_experiment
seed: 42

dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl

# 3 judges x 2 prompts = 6 sensors
judges:
  - name: qwen7b
    backend: litellm
    model: together_ai/Qwen/Qwen2.5-7B-Instruct-Turbo
    temperature: 0.0

  - name: gemma3n
    backend: litellm
    model: together_ai/google/gemma-3n-E4B-it
    temperature: 0.0

  - name: gpt_oss
    backend: litellm
    model: together_ai/openai/gpt-oss-20b
    temperature: 0.0

prompts:
  - safety_direct
  - safety_rubric

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

aggregation:
  methods:
    - single_best
    - majority_vote
    - clean_weighted
    - sentry
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/mixed_experiment_150
