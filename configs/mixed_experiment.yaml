project_name: mixed_experiment
seed: 42

dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl

judges:
  - name: qwen_judge
    backend: ollama
    model: qwen2.5:7b
    temperature: 0.0

  - name: mistral_judge
    backend: ollama
    model: mistral:7b
    temperature: 0.0

  - name: llama_judge
    backend: ollama
    model: llama3.1:8b
    temperature: 0.0

  - name: gemma_judge
    backend: ollama
    model: gemma2:9b
    temperature: 0.0

prompts:
  - safety_direct
  - safety_rubric

attacks:
  - universal_phrase
  - prompt_injection
  - style_artifact
  - master_key

probes:
  - whitespace_normalize
  - strip_judge_directives
  - style_normalize
  - strip_master_keys

methods:
  - single_best
  - majority_vote
  - clean_weighted
  - sentry
  - meta_sentry

meta_sentry_coverage_floor: 0.80

aggregation:
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/mixed_experiment_150