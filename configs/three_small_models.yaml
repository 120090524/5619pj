project_name: three_small_models
seed: 42

dataset:
  calibration_path: data/final/jailjudge_id_calib.jsonl
  test_path: data/final/jailjudge_id_clean_eval.jsonl
  calibration_limit: 150
  test_limit: 150

judges:
  - name: llama3.2-3b
    backend: litellm
    model: groq/llama-3.1-8b-instant
    temperature: 0.0
    # api key read from GROQ_API_KEY env var

  - name: qwen3.5-9b
    backend: litellm
    model: together_ai/Qwen/Qwen3.5-9B
    temperature: 0.0
    # api key read from TOGETHERAI_API_KEY env var

  - name: phi3.5-mini
    backend: litellm
    model: openrouter/microsoft/phi-3.5-mini-128k-instruct
    temperature: 0.0
    # api key read from OPENROUTER_API_KEY env var

prompts: [safety_direct, safety_rubric]

attacks: [universal_phrase, prompt_injection, style_artifact, master_key]

probes: [whitespace_normalize, strip_judge_directives, style_normalize, strip_master_keys]

methods: [single_best, majority_vote, clean_weighted, sentry]

enable_prediction_cache: true
order_variants: [original]
attacks_target_field: response_a

aggregation:
  lambda_attack: 1.20
  rho_dependence: 0.40
  margin: 0.35

output_dir: runs/three_small_models
